<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Vazirmatn, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="55%" stop-color="#F3EDE3"/>
      <stop offset="100%" stop-color="#EAE2D6"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57886A"/>
      <stop offset="100%" stop-color="#4F8A96"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#5A4A3A" flood-opacity="0.14"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#5A4A3A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1120" cy="60" r="180" fill="#57886A" opacity="0.07"/>
  <circle cx="90" cy="470" r="160" fill="#BE7857" opacity="0.08"/>

  <!-- عنوان -->
  <g transform="translate(1110,0)">
    <text x="0" y="86" text-anchor="end" font-size="52" font-weight="800" fill="#3B322A">Renox Planner</text>
    <text x="0" y="126" text-anchor="end" font-size="20" fill="#7A6A5C">برنامه‌ریز جامع زندگی — فارسی، راست‌به‌چپ، آفلاین‌پذیر</text>
  </g>

  <!-- پنجره برنامه -->
  <g transform="translate(60,150)" filter="url(#soft)">
    <rect width="1080" height="330" rx="20" fill="#FFFFFF" opacity="0.94"/>
    <!-- نوار بالا -->
    <path d="M0 20a20 20 0 0 1 20-20h1040a20 20 0 0 1 20 20v24H0z" fill="#FBF8F3"/>
    <circle cx="44" cy="34" r="7" fill="#57886A" opacity="0.85"/>
    <rect x="66" y="26" width="300" height="16" rx="8" fill="#EFE8DD"/>
    <rect x="900" y="22" width="140" height="24" rx="12" fill="url(#brand)" opacity="0.9"/>
    <!-- سایدبار (راست) -->
    <rect x="1012" y="60" width="52" height="254" rx="16" fill="#F7F2EA"/>
    <g fill="#C9BFAF">
      <rect x="1024" y="76" width="28" height="8" rx="4"/>
      <rect x="1024" y="100" width="28" height="8" rx="4"/>
      <rect x="1024" y="124" width="28" height="8" rx="4"/>
      <rect x="1024" y="148" width="28" height="8" rx="4"/>
      <rect x="1024" y="172" width="28" height="8" rx="4"/>
      <rect x="1024" y="196" width="28" height="8" rx="4"/>
    </g>
    <rect x="1017" y="90" width="4" height="24" rx="2" fill="#57886A"/>

    <!-- کارت‌های آماری -->
    <g filter="url(#soft2)">
      <rect x="640" y="76" width="340" height="88" rx="16" fill="#FFFFFF" stroke="#EFE7DA"/>
      <text x="960" y="112" text-anchor="end" font-size="26" font-weight="800" fill="#3B322A">۱۲</text>
      <text x="960" y="140" text-anchor="end" font-size="14" fill="#8A7A6B">تسک امروز</text>
      <path d="M660 148 L690 132 L716 140 L744 118 L772 126 L800 104" fill="none" stroke="#57886A" stroke-width="3" stroke-linecap="round"/>

      <rect x="290" y="76" width="340" height="88" rx="16" fill="#FFFFFF" stroke="#EFE7DA"/>
      <text x="610" y="112" text-anchor="end" font-size="26" font-weight="800" fill="#3B322A">۸ روز</text>
      <text x="610" y="140" text-anchor="end" font-size="14" fill="#8A7A6B">زنجیره عادت</text>
      <path d="M310 148 L338 134 L366 138 L394 122 L422 128 L450 110" fill="none" stroke="#BE7857" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- نمودار میله‌ای -->
    <g transform="translate(40,96)">
      <text x="196" y="0" text-anchor="end" font-size="14" fill="#8A7A6B">هفته گذشته</text>
      <g>
        <rect x="0" y="60" width="16" height="90" rx="8" fill="#57886A" opacity="0.35"/>
        <rect x="28" y="34" width="16" height="116" rx="8" fill="#57886A" opacity="0.55"/>
        <rect x="56" y="50" width="16" height="100" rx="8" fill="#57886A" opacity="0.45"/>
        <rect x="84" y="20" width="16" height="130" rx="8" fill="#57886A"/>
        <rect x="112" y="44" width="16" height="106" rx="8" fill="#57886A" opacity="0.5"/>
        <rect x="140" y="66" width="16" height="84" rx="8" fill="#57886A" opacity="0.3"/>
        <rect x="168" y="12" width="16" height="138" rx="8" fill="#4F8A96"/>
      </g>
      <line x1="0" y1="152" x2="196" y2="152" stroke="#E7DED0" stroke-width="2"/>
    </g>

    <!-- ستون عادت‌ها -->
    <g transform="translate(250,96)">
      <rect width="380" height="196" rx="16" fill="#FFFFFF" stroke="#EFE7DA"/>
      <text x="360" y="34" text-anchor="end" font-size="15" font-weight="700" fill="#3B322A">عادت‌های امروز</text>
      <g>
        <circle cx="344" cy="68" r="9" fill="#57886A"/>
        <rect x="140" y="61" width="186" height="14" rx="7" fill="#F2ECE2"/>
        <circle cx="344" cy="104" r="9" fill="#BE7857"/>
        <rect x="180" y="97" width="146" height="14" rx="7" fill="#F2ECE2"/>
        <circle cx="344" cy="140" r="9" fill="none" stroke="#D9CFC0" stroke-width="2"/>
        <rect x="200" y="133" width="126" height="14" rx="7" fill="#F2ECE2"/>
        <circle cx="344" cy="176" r="9" fill="#4F8A96"/>
        <rect x="162" y="169" width="164" height="14" rx="7" fill="#F2ECE2"/>
      </g>
    </g>

    <!-- هیتمپ -->
    <g transform="translate(640,178)">
      <rect width="340" height="114" rx="16" fill="#FFFFFF" stroke="#EFE7DA"/>
      <g transform="translate(30,36)">
        <g fill="#E9E1D5">
          <rect x="0" y="0" width="20" height="20" rx="6"/><rect x="26" y="0" width="20" height="20" rx="6"/><rect x="52" y="0" width="20" height="20" rx="6"/>
          <rect x="78" y="0" width="20" height="20" rx="6"/><rect x="104" y="0" width="20" height="20" rx="6"/><rect x="130" y="0" width="20" height="20" rx="6"/>
          <rect x="156" y="0" width="20" height="20" rx="6"/><rect x="182" y="0" width="20" height="20" rx="6"/><rect x="208" y="0" width="20" height="20" rx="6"/>
          <rect x="234" y="0" width="20" height="20" rx="6"/><rect x="260" y="0" width="20" height="20" rx="6"/>
        </g>
        <g fill="#57886A" opacity="0.45"><rect x="26" y="0" width="20" height="20" rx="6"/><rect x="104" y="0" width="20" height="20" rx="6"/></g>
        <g fill="#57886A" opacity="0.75"><rect x="78" y="0" width="20" height="20" rx="6"/><rect x="208" y="0" width="20" height="20" rx="6"/></g>
        <g fill="#57886A"><rect x="130" y="0" width="20" height="20" rx="6"/><rect x="234" y="0" width="20" height="20" rx="6"/></g>
      </g>
      <text x="310" y="96" text-anchor="end" font-size="12" fill="#9C8C7C">۳۰ روز اخیر</text>
    </g>
  </g>

  <!-- لوگو -->
  <g transform="translate(60,58)">
    <rect width="64" height="64" rx="18" fill="url(#brand)"/>
    <text x="32" y="45" text-anchor="middle" font-size="36" font-weight="900" fill="#FAF7F2">R</text>
  </g>
</svg>
